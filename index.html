<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Usiminas | Dashboard Executivo - Placas Indicadas Escarfagem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            projectId: "SEU_PROJETO",
            storageBucket: "SEU_PROJETO.appspot.com",
            messagingSenderId: "SEU_ID",
            appId: "SUA_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        window.db = getFirestore(app);
        window.colRef = collection(window.db, "registros_placas");
        
        // Carrega dados ao iniciar
        carregarDadosFirestore();
    </script>

    <style>
        body { background-color: #f1f5f9; font-family: 'Inter', sans-serif; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal-foto { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; z-index: 2000; overflow: hidden; }
        #imgZoomAmpliada { transition: transform 0.1s ease; cursor: grab; }
    </style>
</head>
<body class="p-6">
    <!-- ... (Mantenha seu Header e Main conforme seu arquivo original) ... -->

    <script>
        let registros = [];
        let fotosArray = [];
        let escalaAtual = 1;
        // ... (Mantenha suas funções de Gráficos e PDF conforme seu arquivo original) ...

        // --- NOVA LÓGICA FIRESTORE ---

        async function carregarDadosFirestore() {
            const snapshot = await getDocs(window.colRef);
            registros = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderizar();
        }

        async function salvar() {
            const index = document.getElementById('editIndex').value;
            const dados = {
                data: document.getElementById('iData').value,
                responsavel: document.getElementById('iResponsavel').value,
                letra: document.getElementById('iLetra').value,
                turno: document.getElementById('iTurno').value,
                local: document.getElementById('iLocal').value,
                seq: document.getElementById('iSeq').value,
                pedido: document.getElementById('iPedido').value,
                placa: document.getElementById('iPlaca').value,
                defeito: document.getElementById('iDefeito').value,
                grau: document.getElementById('iGrau').value,
                veio: document.getElementById('iVeio').value,
                indicacao: document.getElementById('iIndicacao').value,
                motivo: document.getElementById('iMotivo').value,
                fotos: fotosArray
            };

            if (index !== "-1") {
                await updateDoc(doc(window.db, "registros_placas", registros[index].id), dados);
            } else {
                await addDoc(window.colRef, dados);
            }
            
            alert("✅ Salvo no Firestore!");
            fecharModal();
            carregarDadosFirestore();
        }

        async function excluir(index) {
            if(confirm("Tem certeza que deseja excluir este registro?")) {
                await deleteDoc(doc(window.db, "registros_placas", registros[index].id));
                carregarDadosFirestore();
            }
        }

        // --- MANUTENÇÃO DA RENDERIZAÇÃO ---
        // --- MANUTENÇÃO DA RENDERIZAÇÃO ---
    function renderizar() {
        const termo = document.getElementById('filtroBusca').value.toLowerCase();
        const corpo = document.getElementById('tabelaCorpo');
        
        registros.sort((a, b) => converterDataParaTimestamp(b.data) - converterDataParaTimestamp(a.data));

        const filtrados = registros.filter(item => 
            String(item.pedido).toLowerCase().includes(termo) || 
            String(item.placa).toLowerCase().includes(termo) || 
            String(item.responsavel).toLowerCase().includes(termo)
        );

        if (filtrados.length === 0) {
            corpo.innerHTML = `<tr><td colspan="9" class="p-6 text-center text-slate-400">Nenhum registro encontrado. Importe um PDF ou cadastre um novo.</td></tr>`;
            atualizarAnaliseGerencial();
            return;
        }

        corpo.innerHTML = filtrados.map((item, index) => {
            let fotosHtml = '<span class="text-slate-300 text-xs">Sem foto</span>';
            if (item.fotos && item.fotos.length > 0) {
                fotosHtml = `<div class="flex gap-1 justify-center flex-wrap">` + 
                    item.fotos.map(foto => `<img src="${foto}" class="w-10 h-8 object-cover rounded shadow border cursor-pointer hover:scale-125 transition" onclick="abrirZoom('${foto}')" title="Clique para ampliar">`).join('') + 
                `</div>`;
            }

            return `
                <tr class="hover:bg-slate-50/80 transition">
                    <td class="p-4 font-bold text-slate-800">${item.data || '-'}</td>
                    <td class="p-4">
                        <span class="bg-slate-100 text-slate-800 font-bold px-2.5 py-1 rounded-md text-[10px]">Equipe ${item.letra || 'C'}</span>
                        <div class="text-[10px] text-slate-400 mt-0.5 truncate max-w-[150px]">${item.responsavel || '-'}</div>
                    </td>
                    <td class="p-4 font-black text-blue-600">${item.pedido || '-'} / ${item.placa || '-'}</td>
                    <td class="p-4 font-bold text-slate-600">#${item.seq || '-'}</td>
                    <td class="p-4">
                        <span class="text-rose-600 font-black">${item.defeito || '-'}</span> 
                        <span class="text-[10px] bg-rose-50 text-rose-700 font-bold px-1.5 py-0.5 rounded ml-1">Grau ${item.grau || '-'}</span>
                    </td>
                    <td class="p-4">
                        <span class="bg-blue-50 text-blue-700 font-black px-2 py-1 rounded text-[11px]">${item.indicacao || '-'}</span>
                    </td>
                    <td class="p-4">
                        <span class="font-bold">Veio ${item.veio || '-'}</span>
                        <div class="text-[10px] text-slate-400">Local: ${item.local || '-'}</div>
                    </td>
                    <td class="p-4 text-center">${fotosHtml}</td>
                    <td class="p-4 text-center space-x-3">
                        <button onclick="abrirModal(true, ${index})" class="text-amber-600 hover:text-amber-800 font-bold" title="Editar"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="excluir(${index})" class="text-slate-300 hover:text-rose-600 font-bold" title="Excluir"><i class="fa-solid fa-trash-can"></i></button>
                    </td>
                </tr>
            `;
        }).join('');
        atualizarAnaliseGerencial();
    }

    // Inicializa carregando os dados do banco na nuvem
    carregarDadosFirestore();
</body>
</html>
